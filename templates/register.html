
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account | AI Land Analyzer</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            color: white;
            background: #03152f;
        }
        .box {
            width: 100%;
            max-width: 420px;
            padding: 28px;
            border: 1px solid #0869ac;
            border-radius: 16px;
            background: linear-gradient(145deg, #074783, #05264f);
        }
        h1 { color: #21d9ff; }
        p { color: #d0e2f5; line-height: 1.5; }
        label { display: block; margin-top: 18px; }
        input {
            width: 100%;
            padding: 13px;
            margin-top: 8px;
            border: 1px solid #4383b5;
            border-radius: 8px;
            background: #03152f;
            color: white;
            font-size: 16px;
        }
        button {
            width: 100%;
            padding: 14px;
            margin-top: 24px;
            border: 0;
            border-radius: 8px;
            background: linear-gradient(90deg, #05c6f7, #0787ff);
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        a { color: #21d9ff; }
        .error { color: #ffd1d1; }
    </style>
</head>
<body>
    <main class="box">
        <h1>Create Account</h1>
        <p>Register to use AI Land Analyzer.</p>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('register') }}">
            <label for="username">Username</label>
            <input id="username" name="username"
                   type="text" minlength="3" required
                   autocomplete="username">

            <label for="password">Password</label>
            <input id="password" name="password"
                   type="password" minlength="8" required
                   autocomplete="new-password">

            <button type="submit">Create Account</button>
        </form>

        <p>Already registered? <a href="/login">Log in</a></p>
        <p><a href="/">Back to Home</a></p>
    </main>
</body>
</html>
